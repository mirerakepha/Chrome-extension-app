<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Entry Drops</title>
    <link rel="stylesheet" href="bulma.min.css">

    <style>
        html, body {
            width: 380px;      /* final popup width */
            margin: 0;
            padding: 0;
        }

        body {
            padding: 16px;     /* this creates left & right spacing */
            box-sizing: border-box;
        }
    </style>

</head>
<body>

    <div class=" m-3">
        <h1 class="title">Global Entry Drops</h1>

        <div class="field">
            <label for="" class="label">Status</label>
            <span class="tag is-success">Running</span>
            <span class="tag is-danger">Stopped</span>
        </div>
    </div>


    <div class=" m-3">
        <div class="field">
            <label for="" class="label">Location ID</label>
            <div class="select">
                <select name="" id=""></select>
            </div>
        </div>

        <div class="field">
            <label for="" class="label">Start Date</label>
            <div class="control">
                <input type="date" class="input">
            </div>
        </div>

        <div class="field">
            <label for="" class="label">End Date</label>
            <div class="control">
                <input type="date" class="input">
            </div>
        </div>
    </div>


    <div class=" m-3">
        <button class="button is-success is-fullwidth">Save & start</button>
    </div>

    <div class=" m-3">
        <button class="button is-danger is-fullwidth">Stop</button> 
    </div>
    
</body>
</html>
